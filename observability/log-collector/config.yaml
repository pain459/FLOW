service:
  flush: 1
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  storage.path: /buffers
  storage.backlog.mem_limit: 16M
parsers:
  - name: app_json
    format: json
pipeline:
  inputs:
    - name: forward
      listen: 0.0.0.0
      port: 24224
      storage.type: filesystem
  filters:
    - name: parser
      match: '*'
      key_name: log
      parser: app_json
      reserve_data: true
  outputs:
    - name: loki
      match: '*'
      host: loki
      port: 3100
      labels: 'job=pulsepay,service=$service'
      line_format: json
      retry_limit: false
      storage.total_limit_size: 64M
