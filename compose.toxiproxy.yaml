# Opt-in, explicit client routing. Verifier, migrations, seed and DB observer
# retain direct authority connections; no transparent interception.
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [chaos-proxy]
    # Bind administration only to its separate private control interface.
    command: [-host, 10.254.251.2, -config, /config/proxies.json]
    volumes: [./chaos/toxiproxy/proxies.json:/config/proxies.json:ro]
    networks:
      internal: {}
      proxy-control:
        ipv4_address: 10.254.251.2
        aliases: [toxiproxy-control]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    user: '1001:1001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    labels: {io.pulsepay.chaos.protected: 'true'}
    logging: {driver: json-file, options: {max-size: '1m', max-file: '2'}}
  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://pulsepay_app:${APP_PASSWORD:?run bootstrap}@toxiproxy:15432/${POSTGRES_DB:-pulsepay}
      REDIS_URL: redis://toxiproxy:16379/0
  outbox-relay:
    environment:
      REDIS_URL: redis://toxiproxy:16379/0
  event-worker:
    environment:
      REDIS_URL: redis://toxiproxy:16379/0
  docker-gate:
    networks:
      chaos-control: {}
      proxy-control:
        ipv4_address: 10.254.251.3
networks:
  proxy-control:
    internal: true
    ipam:
      config: [{subnet: 10.254.251.0/29}]
